<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена — Negroni</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0D0B">
<link rel="icon" type="image/png" sizes="32x32" href="/negroni-bar/img/favicon-32.png">
<link rel="stylesheet" href="/negroni-bar/fonts/fonts.css">
<style>
:root{--night:#0E0D0B;--ivory:#EEE7DA;--champ:#B8996A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ivory)}
body{display:grid;place-items:center;padding:24px;font:300 17px/1.6 'Onest','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
::selection{background:var(--champ);color:var(--night)}
.n{font:400 clamp(96px, 22vw, 220px)/.9 'Prata','Times New Roman',serif;letter-spacing:-.03em;color:var(--champ);margin:0}
h1{font:400 clamp(24px, 3.4vw, 36px)/1.2 'Prata','Times New Roman',serif;margin:.6em 0 .4em}
p{margin:0 auto 32px;max-width:34ch;color:rgba(238,231,218,.66)}
a{display:inline-flex;align-items:center;height:52px;padding:0 30px;border:1px solid var(--champ);color:var(--ivory);text-decoration:none;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;transition:background-color .3s,color .3s}
a:hover{background:var(--champ);color:var(--night)}
a:focus-visible{outline:1px solid var(--champ);outline-offset:4px}
</style>
</head>
<body>
<main>
  <p class="n" aria-hidden="true">404</p>
  <h1>Такой страницы в журнале нет</h1>
  <p>Возможно, ссылка устарела. Вернитесь на обложку, там всё по порядку.</p>
  <a href="/negroni-bar/">На обложку</a>
</main>
</body>
</html>
